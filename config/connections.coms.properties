# Stores holding MMSBench-Net alone, used for the ER'25 comparison.
#
# The main stack keeps three corpora in one PostgreSQL database and one Neo4j instance, which is
# fine for us -- our export addresses scopes by schema, collection and label -- but not for ER'25:
# it takes a database URI and reads everything behind it, so pointed at the shared stack it would
# search TPC-H and UniBench alongside MMSBench-Net and the two systems would not be answering the
# same question. These containers sit on the extractor's own Docker network and hold nothing else.
postgres.pg.url=jdbc:postgresql://localhost:5433/coms
postgres.pg.user=spind
postgres.pg.password=spindpass

# Unauthenticated on purpose: ER'25 derives pymongo's authSource from the URI's
# database, so a root user in `admin` cannot be used, and their own reference
# configuration connects with an empty user and password for the same reason.
mongo.mongo.uri=mongodb://localhost:27018

neo4j.graph.uri=bolt://localhost:7688
neo4j.graph.user=neo4j
neo4j.graph.password=testpassword
